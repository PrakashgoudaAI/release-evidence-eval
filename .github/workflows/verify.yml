name: Verify evaluation harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test contracts, scoring, transports, and CLI failure paths
        run: python -m unittest discover -s tests -v
      - name: Verify authored reference responses
        run: python -m release_eval --responses examples/reference-responses.jsonl --report reports/reference.json
      - name: Prove targeted response faults fail the gate
        run: python -m tools.verify_mutations
      - name: Verify compatible baseline comparison
        run: python -m release_eval --responses examples/reference-responses.jsonl --baseline reports/reference.json --report reports/comparison.json
      - name: Verify repeated-trial failures cannot hide behind an average
        run: python -m tools.verify_experiment
      - name: Verify independent policy guard against authored answers and faults
        run: python -m tools.verify_guard
      - name: Check source and available Git history for known credential patterns
        run: python -m tools.publication_check
      - name: Prepare an allowlisted reference summary for review
        run: python -m tools.export_summary reports/trial-reference.json --output reports/public-summary.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ !cancelled() }}
        with:
          name: evaluation-${{ matrix.os }}-${{ matrix.python }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 7
